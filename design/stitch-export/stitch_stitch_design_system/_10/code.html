<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录与认证 - 智能分析平台</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
            }
          },
          boxShadow: {
            'subtle-card': '0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.03), 0 12px 24px -4px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>
<style data-purpose="background-pattern">
    /* Subtle enterprise grid background pattern */
    .bg-grid-pattern {
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px), radial-gradient(#e2e8f0 0.75px, #f8fafc 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }
  </style>
</head>
<body class="bg-grid-pattern text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-700">
<!-- BEGIN: TopBar -->
<!-- Top subtle header bar for environment status info -->
<header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-200/60 bg-white/70 backdrop-blur-md">
<div class="flex items-center space-x-2.5">
<!-- Enterprise Logo Icon -->
<div class="h-8 w-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</div>
<div class="leading-tight">
<span class="text-sm font-semibold text-slate-800 tracking-tight">智能分析平台</span>
<span class="ml-1.5 text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-mono">Enterprise</span>
</div>
</div>
<!-- Security & Node Status Tag -->
<div class="flex items-center space-x-3 text-xs text-slate-500">
<div class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full font-medium">
<span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        生产环境 · KMS隔离防护
      </div>
<div class="hidden sm:inline-flex items-center gap-1 text-slate-500 hover:text-slate-800 transition-colors cursor-pointer">
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>帮助与安全指引</span>
</div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<!-- Centered Login Card Container -->
<main class="flex-grow flex items-center justify-center px-4 py-8">
<div class="w-full max-w-[440px] bg-white rounded-2xl shadow-subtle-card border border-slate-200/90 p-8 sm:p-9 relative">
<!-- Top Title and Description Block -->
<div class="text-center mb-7">
<div class="mx-auto w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center border border-blue-100 mb-3 shadow-sm">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-xl font-bold text-slate-900 tracking-tight">智能分析平台</h1>
<p class="text-sm text-slate-500 mt-1.5">使用数据与证据驱动业务问答与知识计算</p>
</div>
<!-- Authentication Form -->
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault();">
<!-- Account Field -->
<div>
<label class="block text-xs font-semibold text-slate-700 tracking-wide uppercase mb-1.5" for="username">
            域账号 / 企业邮箱
          </label>
<div class="relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50/50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-colors" id="username" name="username" placeholder="例如 chen.data@enterprise.internal" required="" type="text" value="chen.data@enterprise.internal"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-xs font-semibold text-slate-700 tracking-wide uppercase" for="password">
              密码凭证
            </label>
<a class="text-xs text-blue-600 hover:text-blue-700 font-medium hover:underline" href="javascript:void(0)">
              忘记凭证？
            </a>
</div>
<div class="relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-9 pr-10 py-2.5 text-sm bg-slate-50/50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition-colors" id="password" name="password" placeholder="请输入登录密码" required="" type="password" value="••••••••••••"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors" title="显示或隐藏密码" type="button">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Auxiliary Action Row -->
<div class="flex items-center justify-between pt-1">
<label class="inline-flex items-center cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500/30 transition" type="checkbox"/>
<span class="ml-2 text-xs text-slate-600 font-medium">记住用户名</span>
</label>
<a class="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-blue-600 transition-colors" href="javascript:void(0)">
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>FIDO2 / 动态令牌校验</span>
</a>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm hover:shadow transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm" type="submit">
<span>登录并进入工作台</span>
<svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</form>
<!-- Security Guidance Notice Box -->
<div class="mt-6 pt-5 border-t border-slate-100">
<div class="rounded-lg bg-slate-50 border border-slate-200/70 p-3 text-xs text-slate-500 flex items-start gap-2.5 leading-relaxed">
<svg class="w-4 h-4 text-slate-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>账号由系统管理员创建与分配。首次登录或密码被重置后须完成安全强化。</span>
</div>
</div>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: Footer -->
<!-- Audit & Compliance Footer -->
<footer class="w-full py-4 text-center border-t border-slate-200/60 bg-white/50 backdrop-blur-sm text-xs text-slate-400">
<div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4">
<span>Stitch 数据智能分析平台 v2.4</span>
<span class="hidden sm:inline text-slate-300">|</span>
<span>SOC-2 Type II 审计标准</span>
<span class="hidden sm:inline text-slate-300">|</span>
<span class="inline-flex items-center gap-1.5 text-slate-500">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        集群网关正常
      </span>
</div>
</footer>
<!-- END: Footer -->
</body></html>
